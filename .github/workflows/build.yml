name: Windows build
on:
  push:
    branches: [main, test, "0.22.1", "0.22.2", "0.22.3", "0.22.3-fix", "0.22.3-codex"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate repository layout
        run: python scripts/check-layout.py
      - name: Check WebView boundaries
        run: python scripts/check-web-boundaries.py
      - name: Check version metadata
        run: python scripts/check-version.py
      - name: Check source formatting
        run: dotnet run --project tools/SourceFormatter
      - name: Build launcher
        run: ./scripts/build.ps1

      - name: Run isolated regression checks
        run: ./scripts/run-checks.ps1 -Name AuthChecks,MuaChecks,DownloadChecks,QueueChecks,CompatibilityChecks,WebBridgeChecks

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser check dependencies
        run: npm ci --ignore-scripts
        working-directory: test/WebUiChecks
      - name: Check JavaScript formatting
        run: npm run format:check
        working-directory: test/WebUiChecks
      - name: Check Web UI interactions and responsive layout
        run: npm test
        working-directory: test/WebUiChecks
