name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate repository layout
        run: python scripts/check-layout.py
      - name: Check source formatting
        run: dotnet run --project tools/SourceFormatter
      - name: Validate frontend boundaries
        run: python scripts/check-frontend-boundaries.py

      - name: Build both frontends
        run: ./scripts/build-windows.ps1 -Frontend Both
